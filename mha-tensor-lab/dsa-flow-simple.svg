<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1380 1740" role="img" aria-label="DSA 数据流：Indexer 选择位置，主 MLA 在选中位置计算注意力" style="font-family:Segoe UI,Microsoft YaHei,sans-serif"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#78948a"/></marker><marker id="routeArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#ad582b"/></marker></defs><rect width="1380" height="1740" fill="#fffef9"/><text x="1030" y="1000" text-anchor="middle" font-size="26" fill="#ad582b" font-weight="700">两个问题，两套分数</text><text x="1030" y="1055" text-anchor="middle" font-size="24" fill="#ad582b" font-weight="400">Indexer：应该读哪几行？</text><text x="1030" y="1120" text-anchor="middle" font-size="24" fill="#17634f" font-weight="400">MLA：读到的内容各占多少？</text><path class="edge lit" d="M660 145 V195 H1030 V245" fill="none" stroke="#78948a" stroke-width="2" marker-end="url(#arrow)"/><path class="edge lit" d="M660 145 V195 H305 V665" fill="none" stroke="#78948a" stroke-width="2" marker-end="url(#arrow)"/><text x="305" y="470" text-anchor="middle" font-size="19" fill="#78948a" stroke="#fffef9" stroke-width="8" paint-order="stroke">生成 / 追加 MLA 缓存</text><path class="edge lit" d="M450 95 H25 V1040 H60" fill="none" stroke="#78948a" stroke-width="2" marker-end="url(#arrow)"/><text x="108" y="930" text-anchor="middle" font-size="19" fill="#78948a" stroke="#fffef9" stroke-width="8" paint-order="stroke">主 Query</text><path class="edge " d="M1030 355 V440" fill="none" stroke="#78948a" stroke-width="2" marker-end="url(#arrow)"/><path class="edge " d="M1030 570 V665" fill="none" stroke="#78948a" stroke-width="2" marker-end="url(#arrow)"/><path class="edge route " d="M800 720 H550" fill="none" stroke="#ad582b" stroke-width="2.8" stroke-dasharray="9 7" marker-end="url(#routeArrow)"/><text x="675" y="700" text-anchor="middle" font-size="19" fill="#ad582b" stroke="#fffef9" stroke-width="8" paint-order="stroke">位置编号</text><path class="edge " d="M305 810 V970" fill="none" stroke="#78948a" stroke-width="2" marker-end="url(#arrow)"/><text x="305" y="905" text-anchor="middle" font-size="19" fill="#78948a" stroke="#fffef9" stroke-width="8" paint-order="stroke">选中的 K</text><path class="edge " d="M305 1110 V1200" fill="none" stroke="#78948a" stroke-width="2" marker-end="url(#arrow)"/><text x="305" y="1170" text-anchor="middle" font-size="19" fill="#78948a" stroke="#fffef9" stroke-width="8" paint-order="stroke">新的主注意力分数</text><path class="edge " d="M305 1300 V1390" fill="none" stroke="#78948a" stroke-width="2" marker-end="url(#arrow)"/><text x="305" y="1360" text-anchor="middle" font-size="19" fill="#78948a" stroke="#fffef9" stroke-width="8" paint-order="stroke">真正的权重 A</text><path class="edge " d="M550 775 H635 V1440 H550" fill="none" stroke="#78948a" stroke-width="2" marker-end="url(#arrow)"/><text x="704" y="1375" text-anchor="middle" font-size="19" fill="#78948a" stroke="#fffef9" stroke-width="8" paint-order="stroke">选中的 V</text><path class="edge " d="M305 1490 V1570" fill="none" stroke="#78948a" stroke-width="2" marker-end="url(#arrow)"/><g class="node active" tabindex="0" role="button" aria-label="当前 token 发起查询" data-node="input"><rect class="box" x="450" y="40" width="420" height="105" rx="12" fill="#fffef9" stroke="#8ba296" stroke-width="1.8"/><text x="660" y="74" text-anchor="middle" font-size="23" fill="#17634f" font-weight="650">当前 token 发起查询</text><text x="660" y="105" text-anchor="middle" font-size="19" fill="#20332f" font-weight="400">位置 5「注意力」· 可见 0～5</text></g><g class="node " tabindex="0" role="button" aria-label="Indexer 看全部候选" data-node="index"><rect class="box" x="800" y="245" width="460" height="110" rx="12" fill="#fff6e9" stroke="#bc8455" stroke-width="1.8"/><text x="1030" y="279" text-anchor="middle" font-size="23" fill="#9b4e25" font-weight="650">Indexer 看全部候选</text><text x="1030" y="310" text-anchor="middle" font-size="19" fill="#20332f" font-weight="400">使用自己的 Qᴵ、Kᴵ、wᴵ</text></g><g class="node " tabindex="0" role="button" aria-label="轻量评分，不是最终权重" data-node="rank"><rect class="box" x="800" y="440" width="460" height="130" rx="12" fill="#fff6e9" stroke="#bc8455" stroke-width="1.8"/><text x="1030" y="474" text-anchor="middle" font-size="23" fill="#9b4e25" font-weight="650">轻量评分，不是最终权重</text><text x="1030" y="505" text-anchor="middle" font-size="19" fill="#20332f" font-weight="400">位置 0 / 1 / 2 / 3 / 4 / 5</text><text x="1030" y="532" text-anchor="middle" font-size="19" fill="#677770" font-weight="400">分数 0.5 / 1.75 / 2 / 0.75 / 0.5 / 1.25</text></g><g class="node " tabindex="0" role="button" aria-label="Top-2 → ids=[2, 1]" data-node="top"><rect class="box" x="800" y="665" width="460" height="110" rx="12" fill="#fff6e9" stroke="#bc8455" stroke-width="1.8"/><text x="1030" y="699" text-anchor="middle" font-size="23" fill="#9b4e25" font-weight="650">Top-2 → ids=[2, 1]</text><text x="1030" y="730" text-anchor="middle" font-size="19" fill="#20332f" font-weight="400">这些整数只负责指向缓存行</text></g><g class="node " tabindex="0" role="button" aria-label="从全部 MLA 缓存中选行" data-node="gather"><rect class="box" x="60" y="665" width="490" height="145" rx="12" fill="#e7efe7" stroke="#8ba296" stroke-width="1.8"/><text x="305" y="699" text-anchor="middle" font-size="23" fill="#17634f" font-weight="650">从全部 MLA 缓存中选行</text><text x="305" y="730" text-anchor="middle" font-size="19" fill="#20332f" font-weight="400">6 行 C + 6 行 Kᴿ 都留在缓存中</text><text x="305" y="757" text-anchor="middle" font-size="19" fill="#677770" font-weight="400">本轮只读 [2, 1]；再得到对应 K、V</text></g><g class="node " tabindex="0" role="button" aria-label="主 MLA 重新计算 QK 分数" data-node="score"><rect class="box" x="60" y="970" width="490" height="140" rx="12" fill="#fffef9" stroke="#8ba296" stroke-width="1.8"/><text x="305" y="1004" text-anchor="middle" font-size="23" fill="#17634f" font-weight="650">主 MLA 重新计算 QK 分数</text><text x="305" y="1035" text-anchor="middle" font-size="19" fill="#20332f" font-weight="400">当前 Q 与选中的 2 个 K 匹配</text><text x="305" y="1062" text-anchor="middle" font-size="19" fill="#677770" font-weight="400">内容点积 + RoPE 点积 → 缩放</text></g><g class="node " tabindex="0" role="button" aria-label="softmax 生成真正的注意力权重" data-node="softmax"><rect class="box" x="60" y="1200" width="490" height="100" rx="12" fill="#fffef9" stroke="#8ba296" stroke-width="1.8"/><text x="305" y="1234" text-anchor="middle" font-size="23" fill="#17634f" font-weight="650">softmax 生成真正的注意力权重</text><text x="305" y="1265" text-anchor="middle" font-size="19" fill="#20332f" font-weight="400">每个主头分别计算；只在候选内归一化</text></g><g class="node " tabindex="0" role="button" aria-label="注意力权重 × 选中的 V" data-node="sum"><rect class="box" x="60" y="1390" width="490" height="100" rx="12" fill="#fffef9" stroke="#8ba296" stroke-width="1.8"/><text x="305" y="1424" text-anchor="middle" font-size="23" fill="#17634f" font-weight="650">注意力权重 × 选中的 V</text><text x="305" y="1455" text-anchor="middle" font-size="19" fill="#20332f" font-weight="400">加权求和，得到每个头的内容输出</text></g><g class="node " tabindex="0" role="button" aria-label="拼接头 + 输出投影" data-node="out"><rect class="box" x="60" y="1570" width="490" height="100" rx="12" fill="#fffef9" stroke="#8ba296" stroke-width="1.8"/><text x="305" y="1604" text-anchor="middle" font-size="23" fill="#17634f" font-weight="650">拼接头 + 输出投影</text><text x="305" y="1635" text-anchor="middle" font-size="19" fill="#20332f" font-weight="400">得到当前 token 的新表示 Y</text></g></svg>