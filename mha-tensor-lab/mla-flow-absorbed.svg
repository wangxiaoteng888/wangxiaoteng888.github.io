<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 2240" role="group" aria-label="MLA 吸收路径张量数据流" style="font-family:Segoe UI,Microsoft YaHei,sans-serif"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#78948a"/></marker></defs><rect width="1400" height="2240" fill="#fffef9"/><text x="220" y="28" text-anchor="middle" font-size="18" fill="#677770" font-weight="400">当前查询路径</text><text x="1140" y="28" text-anchor="middle" font-size="18" fill="#17634f" font-weight="400">绿色粗边框 = 需要存入 KV Cache</text><text x="230" y="1870" text-anchor="middle" font-size="23" fill="#ad582b" font-weight="650">同一套 MLA 权重</text><text x="230" y="1910" text-anchor="middle" font-size="23" fill="#677770" font-weight="400">同样的注意力分数</text><text x="230" y="1950" text-anchor="middle" font-size="23" fill="#677770" font-weight="400">同样的最终输出</text><text x="230" y="2010" text-anchor="middle" font-size="20" fill="#17634f" font-weight="400">只调整乘法的括号位置</text><path d="M680 145 V200 H220 V250" fill="none" stroke="#78948a" stroke-width="2" marker-end="url(#arr)"/><text x="300" y="190" text-anchor="middle" font-size="18" fill="#677770" stroke="#fffef9" stroke-width="8" paint-order="stroke">X</text><path d="M680 145 V250" fill="none" stroke="#78948a" stroke-width="2" marker-end="url(#arr)"/><path d="M680 145 V200 H1150 V250" fill="none" stroke="#78948a" stroke-width="2" marker-end="url(#arr)"/><text x="1050" y="190" text-anchor="middle" font-size="18" fill="#677770" stroke="#fffef9" stroke-width="8" paint-order="stroke">X</text><path d="M220 380 V520" fill="none" stroke="#78948a" stroke-width="2" marker-end="url(#arr)"/><text x="220" y="460" text-anchor="middle" font-size="18" fill="#677770" stroke="#fffef9" stroke-width="8" paint-order="stroke">WᵁQ / Wᴽᴿ</text><path d="M220 695 V820" fill="none" stroke="#78948a" stroke-width="2" marker-end="url(#arr)"/><text x="260" y="770" text-anchor="middle" font-size="18" fill="#677770" stroke="#fffef9" stroke-width="8" paint-order="stroke">Qᶜ</text><path d="M220 975 V1170 H480" fill="none" stroke="#78948a" stroke-width="2" marker-end="url(#arr)"/><text x="330" y="1155" text-anchor="middle" font-size="18" fill="#677770" stroke="#fffef9" stroke-width="8" paint-order="stroke">Q̂</text><path d="M410 610 H445 V1105 H480" fill="none" stroke="#78948a" stroke-width="2" marker-end="url(#arr)"/><text x="630" y="1035" text-anchor="middle" font-size="18" fill="#677770" stroke="#fffef9" stroke-width="8" paint-order="stroke">Qᴿ（直接进入位置项）</text><path d="M680 405 V1080" fill="none" stroke="#78948a" stroke-width="2" marker-end="url(#arr)"/><text x="760" y="790" text-anchor="middle" font-size="18" fill="#677770" stroke="#fffef9" stroke-width="8" paint-order="stroke">Cᵀ：按头广播</text><path d="M1150 405 V1170 H1060" fill="none" stroke="#78948a" stroke-width="2" marker-end="url(#arr)"/><text x="1190" y="1030" text-anchor="middle" font-size="18" fill="#677770" stroke="#fffef9" stroke-width="8" paint-order="stroke">Kᴿᵀ</text><path d="M770 1270 V1380" fill="none" stroke="#78948a" stroke-width="2" marker-end="url(#arr)"/><text x="770" y="1335" text-anchor="middle" font-size="18" fill="#677770" stroke="#fffef9" stroke-width="8" paint-order="stroke">未来位置先设为 −∞</text><path d="M770 1495 V1590" fill="none" stroke="#78948a" stroke-width="2" marker-end="url(#arr)"/><path d="M480 330 H460 V1650 H480" fill="none" stroke="#78948a" stroke-width="2" marker-end="url(#arr)"/><text x="300" y="1530" text-anchor="middle" font-size="18" fill="#677770" stroke="#fffef9" stroke-width="8" paint-order="stroke">C：沿历史位置加权</text><path d="M770 1715 V1800" fill="none" stroke="#78948a" stroke-width="2" marker-end="url(#arr)"/><path d="M770 1925 V2025" fill="none" stroke="#78948a" stroke-width="2" marker-end="url(#arr)"/><g class="node " tabindex="0" role="button" data-node="input" aria-label="X：五个 token 的输入"><rect class="box" x="480" y="40" width="400" height="105" rx="12" fill="#fffef9" stroke="#8ba296" stroke-width="1.8"/><text x="680" y="76" text-anchor="middle" font-size="22" fill="#17634f" font-weight="650">X：五个 token 的输入</text><text x="680" y="110" text-anchor="middle" font-size="19" fill="#20332f" font-weight="400">[1,5,4] · 同一注意力层</text></g><g class="node " tabindex="0" role="button" data-node="cq" aria-label="Query 下投影"><rect class="box" x="30" y="250" width="380" height="130" rx="12" fill="#fffef9" stroke="#8ba296" stroke-width="1.8"/><text x="220" y="286" text-anchor="middle" font-size="22" fill="#17634f" font-weight="650">Query 下投影</text><text x="220" y="320" text-anchor="middle" font-size="19" fill="#20332f" font-weight="400">Cᴽ = X WᴰQ</text><text x="220" y="348" text-anchor="middle" font-size="19" fill="#677770" font-weight="400">[1,5,4] × [4,2] → [1,5,2]</text></g><g class="node active" tabindex="0" role="button" data-node="c" aria-label="缓存① 共享压缩内容 Cᴷⱽ"><rect class="box" x="480" y="250" width="400" height="155" rx="12" fill="#e3eee4" stroke="#17634f" stroke-width="3"/><text x="680" y="286" text-anchor="middle" font-size="22" fill="#17634f" font-weight="650">缓存① 共享压缩内容 Cᴷⱽ</text><text x="680" y="320" text-anchor="middle" font-size="19" fill="#20332f" font-weight="400">C = X Wᴰᴷⱽ</text><text x="680" y="348" text-anchor="middle" font-size="19" fill="#677770" font-weight="400">[1,5,4] × [4,3] → [1,5,3]</text><text x="680" y="376" text-anchor="middle" font-size="19" fill="#677770" font-weight="400">每个 token 存 3 个数</text></g><g class="node " tabindex="0" role="button" data-node="kr" aria-label="缓存② 已旋转的位置 Key"><rect class="box" x="950" y="250" width="400" height="155" rx="12" fill="#e3eee4" stroke="#17634f" stroke-width="3"/><text x="1150" y="286" text-anchor="middle" font-size="22" fill="#17634f" font-weight="650">缓存② 已旋转的位置 Key</text><text x="1150" y="320" text-anchor="middle" font-size="19" fill="#20332f" font-weight="400">Kᴿ = RoPE(X Wᴷᴿ)</text><text x="1150" y="348" text-anchor="middle" font-size="19" fill="#677770" font-weight="400">[1,5,4] × [4,2] → [1,5,2]</text><text x="1150" y="376" text-anchor="middle" font-size="19" fill="#677770" font-weight="400">各主头共享；每 token 再存 2 个数</text></g><g class="node " tabindex="0" role="button" data-node="q" aria-label="各头的 Qᶜ 与 Qᴿ"><rect class="box" x="30" y="520" width="380" height="175" rx="12" fill="#fffef9" stroke="#8ba296" stroke-width="1.8"/><text x="220" y="556" text-anchor="middle" font-size="22" fill="#17634f" font-weight="650">各头的 Qᶜ 与 Qᴿ</text><text x="220" y="590" text-anchor="middle" font-size="19" fill="#20332f" font-weight="400">Cᴽ 投影 → 两组 [1,5,4]</text><text x="220" y="618" text-anchor="middle" font-size="19" fill="#677770" font-weight="400">reshape → [1,5,2,2]</text><text x="220" y="646" text-anchor="middle" font-size="19" fill="#677770" font-weight="400">transpose → [1,2,5,2]</text><text x="220" y="674" text-anchor="middle" font-size="19" fill="#677770" font-weight="400">Qᴿ 额外按位置做 RoPE</text></g><g class="node " tabindex="0" role="button" data-node="qhat" aria-label="吸收 K 上投影 → Q̂"><rect class="box" x="30" y="820" width="380" height="155" rx="12" fill="#fffef9" stroke="#8ba296" stroke-width="1.8"/><text x="220" y="856" text-anchor="middle" font-size="22" fill="#17634f" font-weight="650">吸收 K 上投影 → Q̂</text><text x="220" y="890" text-anchor="middle" font-size="19" fill="#20332f" font-weight="400">Q̂_h = Qᶜ_h Uᴷ_hᵀ</text><text x="220" y="918" text-anchor="middle" font-size="19" fill="#677770" font-weight="400">[5,2] × [2,3] → [5,3]</text><text x="220" y="946" text-anchor="middle" font-size="19" fill="#677770" font-weight="400">全部头：[1,2,5,3]</text></g><g class="node " tabindex="0" role="button" data-node="score" aria-label="直接与 C 缓存点积，不展开 Kᶜ"><rect class="box" x="480" y="1080" width="580" height="190" rx="12" fill="#fffef9" stroke="#8ba296" stroke-width="1.8"/><text x="770" y="1116" text-anchor="middle" font-size="22" fill="#17634f" font-weight="650">直接与 C 缓存点积，不展开 Kᶜ</text><text x="770" y="1150" text-anchor="middle" font-size="19" fill="#20332f" font-weight="400">S = [Q̂Cᵀ + Qᴿ(Kᴿ)ᵀ] / 2</text><text x="770" y="1178" text-anchor="middle" font-size="19" fill="#677770" font-weight="400">内容：[1,2,5,3] × Cᵀ [1,1,3,5]</text><text x="770" y="1206" text-anchor="middle" font-size="19" fill="#677770" font-weight="400">位置：[1,2,5,2] × Kᴿᵀ [1,1,2,5]</text><text x="770" y="1234" text-anchor="middle" font-size="19" fill="#677770" font-weight="400">缓存插入头轴并广播 → [1,2,5,5]</text></g><g class="node " tabindex="0" role="button" data-node="a" aria-label="因果 mask + softmax"><rect class="box" x="480" y="1380" width="580" height="115" rx="12" fill="#fffef9" stroke="#8ba296" stroke-width="1.8"/><text x="770" y="1416" text-anchor="middle" font-size="22" fill="#17634f" font-weight="650">因果 mask + softmax</text><text x="770" y="1450" text-anchor="middle" font-size="19" fill="#20332f" font-weight="400">A [1,2,5,5] · 与展开路径相同</text></g><g class="node " tabindex="0" role="button" data-node="latent" aria-label="先汇总共享 C：L_h = A_h C"><rect class="box" x="480" y="1590" width="580" height="125" rx="12" fill="#fffef9" stroke="#8ba296" stroke-width="1.8"/><text x="770" y="1626" text-anchor="middle" font-size="22" fill="#17634f" font-weight="650">先汇总共享 C：L_h = A_h C</text><text x="770" y="1660" text-anchor="middle" font-size="19" fill="#20332f" font-weight="400">[1,2,5,5] × C [1,1,5,3]（广播）</text><text x="770" y="1688" text-anchor="middle" font-size="19" fill="#677770" font-weight="400">→ L [1,2,5,3]</text></g><g class="node " tabindex="0" role="button" data-node="up" aria-label="再上投影：Z_h = L_h Uⱽ_h"><rect class="box" x="480" y="1800" width="580" height="125" rx="12" fill="#fffef9" stroke="#8ba296" stroke-width="1.8"/><text x="770" y="1836" text-anchor="middle" font-size="22" fill="#17634f" font-weight="650">再上投影：Z_h = L_h Uⱽ_h</text><text x="770" y="1870" text-anchor="middle" font-size="19" fill="#20332f" font-weight="400">[5,3] × [3,2] → 每头 [5,2]</text><text x="770" y="1898" text-anchor="middle" font-size="19" fill="#677770" font-weight="400">全部头 Z [1,2,5,2]</text></g><g class="node " tabindex="0" role="button" data-node="out" aria-label="合并头与输出投影"><rect class="box" x="480" y="2025" width="580" height="135" rx="12" fill="#fffef9" stroke="#8ba296" stroke-width="1.8"/><text x="770" y="2061" text-anchor="middle" font-size="22" fill="#17634f" font-weight="650">合并头与输出投影</text><text x="770" y="2095" text-anchor="middle" font-size="19" fill="#20332f" font-weight="400">[1,2,5,2] → [1,5,4] × Wᴼ</text><text x="770" y="2123" text-anchor="middle" font-size="19" fill="#677770" font-weight="400">→ Y [1,5,4] · 与展开路径相同</text></g></svg>