<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 2430" role="group" aria-label="5 个 token 的 DSA prefill 完整数据流" style="font-family:Segoe UI,Microsoft YaHei,sans-serif"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#78948a"/></marker><marker id="orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#ad582b"/></marker></defs><rect width="1400" height="2430" fill="#fffef9"/><rect x="940" y="235" width="440" height="925" rx="20" fill="#fbf0e2"/><text x="220" y="30" text-anchor="middle" font-size="18" fill="#677770" font-weight="400">共享的主 MLA 缓存</text><text x="1160" y="30" text-anchor="middle" font-size="18" fill="#ad582b" font-weight="400">DSA 新增：每行独立选位置</text><text x="1160" y="1375" text-anchor="middle" font-size="24" fill="#ad582b" font-weight="650">5 行可以一起算。</text><text x="1160" y="1420" text-anchor="middle" font-size="22" fill="#677770" font-weight="400">但每行能读的范围不同，</text><text x="1160" y="1460" text-anchor="middle" font-size="22" fill="#677770" font-weight="400">选出来的 ids 也可以不同。</text><text x="1150" y="1700" text-anchor="middle" font-size="20" fill="#677770" font-weight="400">主分数形状</text><text x="1150" y="1750" text-anchor="middle" font-size="34" fill="#17634f" font-weight="700">[1,2,5,2]</text><text x="1150" y="1800" text-anchor="middle" font-size="21" fill="#17634f" font-weight="400">↑ 5 个 query 一直保留</text><text x="1150" y="2050" text-anchor="middle" font-size="22" fill="#ad582b" font-weight="650">没有把 5 行 query 合成 1 行</text><text x="1150" y="2095" text-anchor="middle" font-size="21" fill="#677770" font-weight="400">每个 query 得到自己的新表示</text><path d="M680 160 V210 H220 V260" fill="none" stroke="#78948a" stroke-width="2" marker-end="url(#arrow)"/><text x="260" y="200" text-anchor="middle" font-size="18" fill="#78948a" stroke="#fffef9" stroke-width="8" paint-order="stroke">X</text><path d="M680 160 V260" fill="none" stroke="#78948a" stroke-width="2" marker-end="url(#arrow)"/><path d="M680 160 V210 H1160 V260" fill="none" stroke="#78948a" stroke-width="2" marker-end="url(#arrow)"/><text x="1060" y="200" text-anchor="middle" font-size="18" fill="#78948a" stroke="#fffef9" stroke-width="8" paint-order="stroke">X</text><path d="M860 325 H960" fill="none" stroke="#78948a" stroke-width="2" marker-end="url(#arrow)"/><text x="910" y="313" text-anchor="middle" font-size="18" fill="#78948a" stroke="#fffef9" stroke-width="8" paint-order="stroke">Cᴽ</text><path d="M220 400 V520" fill="none" stroke="#78948a" stroke-width="2" marker-end="url(#arrow)"/><text x="220" y="472" text-anchor="middle" font-size="18" fill="#78948a" stroke="#fffef9" stroke-width="8" paint-order="stroke">整块写入 5 行</text><path d="M680 400 V520" fill="none" stroke="#78948a" stroke-width="2" marker-end="url(#arrow)"/><text x="680" y="472" text-anchor="middle" font-size="18" fill="#78948a" stroke="#fffef9" stroke-width="8" paint-order="stroke">投影 / 拆分 / RoPE</text><path d="M1160 415 V520" fill="none" stroke="#78948a" stroke-width="2" marker-end="url(#arrow)"/><path d="M1160 770 V880" fill="none" stroke="#78948a" stroke-width="2" marker-end="url(#arrow)"/><text x="1160" y="830" text-anchor="middle" font-size="18" fill="#78948a" stroke="#fffef9" stroke-width="8" paint-order="stroke">每行屏蔽 s &gt; t 后再选</text><path d="M220 680 V900" fill="none" stroke="#78948a" stroke-width="2" marker-end="url(#arrow)"/><text x="220" y="810" text-anchor="middle" font-size="18" fill="#78948a" stroke="#fffef9" stroke-width="8" paint-order="stroke">5 行缓存仍然全部保留</text><path d="M1160 1130 V1210 H430 V980 H400" fill="none" stroke="#ad582b" stroke-width="2.8" stroke-dasharray="9 7" marker-end="url(#orange)"/><text x="830" y="1200" text-anchor="middle" font-size="18" fill="#ad582b" stroke="#fffef9" stroke-width="8" paint-order="stroke">传递 5 份位置列表；不是所有 query 共用一份</text><path d="M220 1060 V1320" fill="none" stroke="#78948a" stroke-width="2" marker-end="url(#arrow)"/><text x="220" y="1270" text-anchor="middle" font-size="18" fill="#78948a" stroke="#fffef9" stroke-width="8" paint-order="stroke">逐 query 选择的缓存行</text><path d="M680 680 V1550" fill="none" stroke="#78948a" stroke-width="2" marker-end="url(#arrow)"/><text x="745" y="1430" text-anchor="middle" font-size="18" fill="#78948a" stroke="#fffef9" stroke-width="8" paint-order="stroke">5 个 query 的 Qᶜ、Qᴿ</text><path d="M400 1380 H450 V1630 H500" fill="none" stroke="#78948a" stroke-width="2" marker-end="url(#arrow)"/><text x="350" y="1545" text-anchor="middle" font-size="18" fill="#78948a" stroke="#fffef9" stroke-width="8" paint-order="stroke">各 query 选中的 K</text><path d="M680 1710 V1800" fill="none" stroke="#78948a" stroke-width="2" marker-end="url(#arrow)"/><text x="680" y="1770" text-anchor="middle" font-size="18" fill="#78948a" stroke="#fffef9" stroke-width="8" paint-order="stroke">主注意力 logits</text><path d="M680 1925 V2020" fill="none" stroke="#78948a" stroke-width="2" marker-end="url(#arrow)"/><text x="680" y="1985" text-anchor="middle" font-size="18" fill="#78948a" stroke="#fffef9" stroke-width="8" paint-order="stroke">A：每个头、每个 query 各一行</text><path d="M220 1480 V2085 H500" fill="none" stroke="#78948a" stroke-width="2" marker-end="url(#arrow)"/><text x="260" y="2030" text-anchor="middle" font-size="18" fill="#78948a" stroke="#fffef9" stroke-width="8" paint-order="stroke">各 query 选中的 V</text><path d="M680 2145 V2240" fill="none" stroke="#78948a" stroke-width="2" marker-end="url(#arrow)"/><text x="680" y="2205" text-anchor="middle" font-size="18" fill="#78948a" stroke="#fffef9" stroke-width="8" paint-order="stroke">转置并拼接头</text><g class="node active" tabindex="0" role="button" aria-label="① 一次输入 5 个 token" data-node="input"><rect class="box" x="500" y="45" width="360" height="115" rx="12" fill="#fffef9" stroke="#8ba296" stroke-width="1.8"/><text x="680" y="80" text-anchor="middle" font-size="22" fill="#17634f" font-weight="650">① 一次输入 5 个 token</text><text x="680" y="114" text-anchor="middle" font-size="19" fill="#20332f" font-weight="400">X [1,5,4]</text><text x="680" y="143" text-anchor="middle" font-size="19" fill="#677770" font-weight="400">位置 0、1、2、3、4 · 无旧缓存</text></g><g class="node " tabindex="0" role="button" aria-label="MLA 缓存投影" data-node="kv"><rect class="box" x="40" y="260" width="360" height="140" rx="12" fill="#fffef9" stroke="#8ba296" stroke-width="1.8"/><text x="220" y="295" text-anchor="middle" font-size="22" fill="#17634f" font-weight="650">MLA 缓存投影</text><text x="220" y="329" text-anchor="middle" font-size="19" fill="#20332f" font-weight="400">C_new [1,5,2]</text><text x="220" y="358" text-anchor="middle" font-size="19" fill="#677770" font-weight="400">Kᴿ_new [1,5,2]</text><text x="220" y="387" text-anchor="middle" font-size="19" fill="#677770" font-weight="400">每行按原始位置做 RoPE</text></g><g class="node " tabindex="0" role="button" aria-label="查询降维" data-node="cq"><rect class="box" x="500" y="260" width="360" height="140" rx="12" fill="#fffef9" stroke="#8ba296" stroke-width="1.8"/><text x="680" y="295" text-anchor="middle" font-size="22" fill="#17634f" font-weight="650">查询降维</text><text x="680" y="329" text-anchor="middle" font-size="19" fill="#20332f" font-weight="400">X WᴰQ → Cᴽ</text><text x="680" y="358" text-anchor="middle" font-size="19" fill="#677770" font-weight="400">[1,5,4] → [1,5,2]</text><text x="680" y="387" text-anchor="middle" font-size="19" fill="#677770" font-weight="400">5 行一起投影</text></g><g class="node " tabindex="0" role="button" aria-label="② Indexer 独立投影" data-node="index"><rect class="box" x="960" y="260" width="400" height="155" rx="12" fill="#fff6e9" stroke="#bc8455" stroke-width="1.8"/><text x="1160" y="295" text-anchor="middle" font-size="22" fill="#9b4e25" font-weight="650">② Indexer 独立投影</text><text x="1160" y="329" text-anchor="middle" font-size="19" fill="#20332f" font-weight="400">Qᴵ ← Cᴽ；Kᴵ、wᴵ ← X</text><text x="1160" y="358" text-anchor="middle" font-size="19" fill="#677770" font-weight="400">Qᴵ [1,2,5,2]</text><text x="1160" y="387" text-anchor="middle" font-size="19" fill="#677770" font-weight="400">Kᴵ [1,5,2] · wᴵ [1,5,2]</text></g><g class="node " tabindex="0" role="button" aria-label="全部 5 行 MLA 缓存" data-node="cache"><rect class="box" x="40" y="520" width="360" height="160" rx="12" fill="#e7efe7" stroke="#8ba296" stroke-width="1.8"/><text x="220" y="555" text-anchor="middle" font-size="22" fill="#17634f" font-weight="650">全部 5 行 MLA 缓存</text><text x="220" y="589" text-anchor="middle" font-size="19" fill="#20332f" font-weight="400">C_cache [1,5,2]</text><text x="220" y="618" text-anchor="middle" font-size="19" fill="#677770" font-weight="400">Kᴿ_cache [1,5,2]</text><text x="220" y="647" text-anchor="middle" font-size="19" fill="#677770" font-weight="400">共享存储，逐行限制可见范围</text></g><g class="node " tabindex="0" role="button" aria-label="主 MLA：5 个 query × 2 头" data-node="q"><rect class="box" x="500" y="520" width="360" height="160" rx="12" fill="#fffef9" stroke="#8ba296" stroke-width="1.8"/><text x="680" y="555" text-anchor="middle" font-size="22" fill="#17634f" font-weight="650">主 MLA：5 个 query × 2 头</text><text x="680" y="589" text-anchor="middle" font-size="19" fill="#20332f" font-weight="400">Qᶜ [1,2,5,2]</text><text x="680" y="618" text-anchor="middle" font-size="19" fill="#677770" font-weight="400">Qᴿ [1,2,5,2]</text><text x="680" y="647" text-anchor="middle" font-size="19" fill="#677770" font-weight="400">维度顺序 [B,H,Tq,d]</text></g><g class="node " tabindex="0" role="button" aria-label="③ I [1,5,5] + 因果遮罩" data-node="rank"><rect class="box" x="960" y="520" width="400" height="250" rx="12" fill="#fff6e9" stroke="#bc8455" stroke-width="1.8"/><text x="1160" y="555" text-anchor="middle" font-size="22" fill="#9b4e25" font-weight="650">③ I [1,5,5] + 因果遮罩</text><text x="1160" y="589" text-anchor="middle" font-size="18" fill="#20332f" font-weight="400">q0  1   ×   ×   ×   ×</text><text x="1160" y="618" text-anchor="middle" font-size="18" fill="#677770" font-weight="400">q1  0.5   0.25   ×   ×   ×</text><text x="1160" y="647" text-anchor="middle" font-size="18" fill="#677770" font-weight="400">q2  0.5   1.75   2   ×   ×</text><text x="1160" y="676" text-anchor="middle" font-size="18" fill="#677770" font-weight="400">q3  1   0   0.5   0   ×</text><text x="1160" y="705" text-anchor="middle" font-size="18" fill="#677770" font-weight="400">q4  0.5   0.25   1   0.25   0.5</text><text x="1160" y="734" text-anchor="middle" font-size="18" fill="#677770" font-weight="400">× = −∞：不能看未来</text></g><g class="node " tabindex="0" role="button" aria-label="④ 每个 query 独立选 Top-2" data-node="top"><rect class="box" x="960" y="880" width="400" height="250" rx="12" fill="#fff6e9" stroke="#bc8455" stroke-width="1.8"/><text x="1160" y="915" text-anchor="middle" font-size="22" fill="#9b4e25" font-weight="650">④ 每个 query 独立选 Top-2</text><text x="1160" y="949" text-anchor="middle" font-size="19" fill="#20332f" font-weight="400">q0 → [0, —]</text><text x="1160" y="978" text-anchor="middle" font-size="19" fill="#677770" font-weight="400">q1 → [0, 1]</text><text x="1160" y="1007" text-anchor="middle" font-size="19" fill="#677770" font-weight="400">q2 → [2, 1]</text><text x="1160" y="1036" text-anchor="middle" font-size="19" fill="#677770" font-weight="400">q3 → [0, 2]</text><text x="1160" y="1065" text-anchor="middle" font-size="19" fill="#677770" font-weight="400">q4 → [2, 0]</text><text x="1160" y="1094" text-anchor="middle" font-size="19" fill="#677770" font-weight="400">ids [1,5,2]；— = 无效槽</text></g><g class="node " tabindex="0" role="button" aria-label="⑤ 每行按自己的 ids 读缓存" data-node="gather"><rect class="box" x="40" y="900" width="360" height="160" rx="12" fill="#e7efe7" stroke="#8ba296" stroke-width="1.8"/><text x="220" y="935" text-anchor="middle" font-size="22" fill="#17634f" font-weight="650">⑤ 每行按自己的 ids 读缓存</text><text x="220" y="969" text-anchor="middle" font-size="19" fill="#20332f" font-weight="400">C_sel [1,5,2,2]</text><text x="220" y="998" text-anchor="middle" font-size="19" fill="#677770" font-weight="400">Kᴿ_sel [1,5,2,2]</text><text x="220" y="1027" text-anchor="middle" font-size="19" fill="#677770" font-weight="400">顺序 [B,Tq,k,d]</text></g><g class="node " tabindex="0" role="button" aria-label="选中的 C → 各头的 K、V" data-node="expand"><rect class="box" x="40" y="1320" width="360" height="160" rx="12" fill="#fffef9" stroke="#8ba296" stroke-width="1.8"/><text x="220" y="1355" text-anchor="middle" font-size="22" fill="#17634f" font-weight="650">选中的 C → 各头的 K、V</text><text x="220" y="1389" text-anchor="middle" font-size="19" fill="#20332f" font-weight="400">Kᶜ_h = C_sel Uᴷ_h</text><text x="220" y="1418" text-anchor="middle" font-size="19" fill="#677770" font-weight="400">V_h = C_sel Uⱽ_h；共享 Kᴿ</text><text x="220" y="1447" text-anchor="middle" font-size="19" fill="#677770" font-weight="400">各 [1,2,5,2,2]</text><text x="220" y="1476" text-anchor="middle" font-size="19" fill="#677770" font-weight="400">顺序 [B,H,Tq,k,d]</text></g><g class="node " tabindex="0" role="button" aria-label="⑥ 每头、每行重新算 QK" data-node="score"><rect class="box" x="500" y="1550" width="360" height="160" rx="12" fill="#fffef9" stroke="#8ba296" stroke-width="1.8"/><text x="680" y="1585" text-anchor="middle" font-size="22" fill="#17634f" font-weight="650">⑥ 每头、每行重新算 QK</text><text x="680" y="1619" text-anchor="middle" font-size="19" fill="#20332f" font-weight="400">内容点积 + RoPE 点积</text><text x="680" y="1648" text-anchor="middle" font-size="19" fill="#677770" font-weight="400">除以 √(dₙ+dᵣ) = 2</text><text x="680" y="1677" text-anchor="middle" font-size="19" fill="#677770" font-weight="400">S [1,2,5,2]</text><text x="680" y="1706" text-anchor="middle" font-size="19" fill="#677770" font-weight="400">无效槽设为 −∞</text></g><g class="node " tabindex="0" role="button" aria-label="⑦ 对每行的候选做 softmax" data-node="softmax"><rect class="box" x="500" y="1800" width="360" height="125" rx="12" fill="#fffef9" stroke="#8ba296" stroke-width="1.8"/><text x="680" y="1835" text-anchor="middle" font-size="22" fill="#17634f" font-weight="650">⑦ 对每行的候选做 softmax</text><text x="680" y="1869" text-anchor="middle" font-size="19" fill="#20332f" font-weight="400">A [1,2,5,2]</text><text x="680" y="1898" text-anchor="middle" font-size="19" fill="#677770" font-weight="400">每行归一化；无效槽权重为 0</text></g><g class="node " tabindex="0" role="button" aria-label="⑧ 逐行加权选中的 V" data-node="sum"><rect class="box" x="500" y="2020" width="360" height="125" rx="12" fill="#fffef9" stroke="#8ba296" stroke-width="1.8"/><text x="680" y="2055" text-anchor="middle" font-size="22" fill="#17634f" font-weight="650">⑧ 逐行加权选中的 V</text><text x="680" y="2089" text-anchor="middle" font-size="19" fill="#20332f" font-weight="400">Z [1,2,5,2]</text><text x="680" y="2118" text-anchor="middle" font-size="19" fill="#677770" font-weight="400">对 k 求和，保留 5 个 query</text></g><g class="node " tabindex="0" role="button" aria-label="⑨ 合并头 + 输出投影" data-node="out"><rect class="box" x="500" y="2240" width="360" height="125" rx="12" fill="#fffef9" stroke="#8ba296" stroke-width="1.8"/><text x="680" y="2275" text-anchor="middle" font-size="22" fill="#17634f" font-weight="650">⑨ 合并头 + 输出投影</text><text x="680" y="2309" text-anchor="middle" font-size="19" fill="#20332f" font-weight="400">[1,2,5,2] → [1,5,4]</text><text x="680" y="2338" text-anchor="middle" font-size="19" fill="#677770" font-weight="400">Y 仍有 5 行：每 token 一个输出</text></g></svg>