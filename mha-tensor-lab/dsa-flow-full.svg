<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1380 2070" role="img" aria-label="DSA 数据流：Indexer 选择位置，主 MLA 在选中位置计算注意力" style="font-family:Segoe UI,Microsoft YaHei,sans-serif"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#78948a"/></marker><marker id="routeArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#ad582b"/></marker></defs><rect width="1380" height="2070" fill="#fffef9"/><text x="220" y="30" text-anchor="middle" font-size="18" fill="#677770" font-weight="400">缓存路径</text><text x="1150" y="30" text-anchor="middle" font-size="18" fill="#ad582b" font-weight="400">DSA 新增：选位置的路径</text><rect x="925" y="220" width="435" height="670" rx="20" fill="#fbf0e2"/><text x="1138" y="1080" text-anchor="middle" font-size="23" fill="#ad582b" font-weight="600">这条分支到 ids 就结束了。</text><text x="1138" y="1125" text-anchor="middle" font-size="22" fill="#677770" font-weight="400">没有把 Indexer 分数</text><text x="1138" y="1160" text-anchor="middle" font-size="22" fill="#677770" font-weight="400">传给 softmax 或乘 V。</text><text x="1110" y="1370" text-anchor="middle" font-size="22" fill="#677770" font-weight="400">注意力的长度轴</text><text x="1110" y="1420" text-anchor="middle" font-size="38" fill="#17634f" font-weight="700">6 → 2</text><text x="1110" y="1460" text-anchor="middle" font-size="22" fill="#17634f" font-weight="400">稀疏发生在这里</text><path class="edge lit" d="M680 150 V195 H220 V245" fill="none" stroke="#78948a" stroke-width="2" marker-end="url(#arrow)"/><text x="270" y="185" text-anchor="middle" font-size="19" fill="#78948a" stroke="#fffef9" stroke-width="8" paint-order="stroke">X_new</text><path class="edge lit" d="M680 150 V245" fill="none" stroke="#78948a" stroke-width="2" marker-end="url(#arrow)"/><path class="edge lit" d="M680 150 V195 H1150 V245" fill="none" stroke="#78948a" stroke-width="2" marker-end="url(#arrow)"/><text x="1010" y="185" text-anchor="middle" font-size="19" fill="#78948a" stroke="#fffef9" stroke-width="8" paint-order="stroke">X_new</text><path class="edge " d="M860 305 H960" fill="none" stroke="#78948a" stroke-width="2" marker-end="url(#arrow)"/><text x="910" y="292" text-anchor="middle" font-size="19" fill="#78948a" stroke="#fffef9" stroke-width="8" paint-order="stroke">Cᴽ</text><path class="edge " d="M220 370 V470" fill="none" stroke="#78948a" stroke-width="2" marker-end="url(#arrow)"/><text x="290" y="430" text-anchor="middle" font-size="19" fill="#78948a" stroke="#fffef9" stroke-width="8" paint-order="stroke">追加到历史</text><path class="edge " d="M680 370 V470" fill="none" stroke="#78948a" stroke-width="2" marker-end="url(#arrow)"/><text x="680" y="430" text-anchor="middle" font-size="19" fill="#78948a" stroke="#fffef9" stroke-width="8" paint-order="stroke">投影 / 拆分 / RoPE</text><path class="edge " d="M1150 395 V500" fill="none" stroke="#78948a" stroke-width="2" marker-end="url(#arrow)"/><path class="edge " d="M1150 640 V735" fill="none" stroke="#78948a" stroke-width="2" marker-end="url(#arrow)"/><text x="1150" y="690" text-anchor="middle" font-size="19" fill="#78948a" stroke="#fffef9" stroke-width="8" paint-order="stroke">因果约束：s ≤ 5</text><path class="edge route " d="M1150 855 V965 H425 V830 H400" fill="none" stroke="#ad582b" stroke-width="2.8" stroke-dasharray="9 7" marker-end="url(#routeArrow)"/><text x="820" y="955" text-anchor="middle" font-size="19" fill="#ad582b" stroke="#fffef9" stroke-width="8" paint-order="stroke">只传 ids：选择哪几行</text><path class="edge " d="M220 610 V760" fill="none" stroke="#78948a" stroke-width="2" marker-end="url(#arrow)"/><text x="220" y="695" text-anchor="middle" font-size="19" fill="#78948a" stroke="#fffef9" stroke-width="8" paint-order="stroke">C_cache、Kᴿ_cache</text><path class="edge " d="M220 900 V1050" fill="none" stroke="#78948a" stroke-width="2" marker-end="url(#arrow)"/><text x="220" y="1012" text-anchor="middle" font-size="19" fill="#78948a" stroke="#fffef9" stroke-width="8" paint-order="stroke">选中的压缩内容 + 位置 Key</text><path class="edge " d="M680 610 V1260" fill="none" stroke="#78948a" stroke-width="2" marker-end="url(#arrow)"/><text x="745" y="1170" text-anchor="middle" font-size="19" fill="#78948a" stroke="#fffef9" stroke-width="8" paint-order="stroke">Qᶜ、Qᴿ</text><path class="edge " d="M400 1115 H455 V1340 H500" fill="none" stroke="#78948a" stroke-width="2" marker-end="url(#arrow)"/><text x="457" y="1250" text-anchor="middle" font-size="19" fill="#78948a" stroke="#fffef9" stroke-width="8" paint-order="stroke">Kᶜ、Kᴿ</text><path class="edge " d="M680 1420 V1500" fill="none" stroke="#78948a" stroke-width="2" marker-end="url(#arrow)"/><text x="680" y="1470" text-anchor="middle" font-size="19" fill="#78948a" stroke="#fffef9" stroke-width="8" paint-order="stroke">主注意力 logits</text><path class="edge " d="M680 1610 V1710" fill="none" stroke="#78948a" stroke-width="2" marker-end="url(#arrow)"/><text x="680" y="1670" text-anchor="middle" font-size="19" fill="#78948a" stroke="#fffef9" stroke-width="8" paint-order="stroke">A：每头各自的权重</text><path class="edge " d="M220 1210 V1765 H500" fill="none" stroke="#78948a" stroke-width="2" marker-end="url(#arrow)"/><text x="285" y="1710" text-anchor="middle" font-size="19" fill="#78948a" stroke="#fffef9" stroke-width="8" paint-order="stroke">V：参与最终内容汇总</text><path class="edge " d="M680 1820 V1905" fill="none" stroke="#78948a" stroke-width="2" marker-end="url(#arrow)"/><text x="680" y="1870" text-anchor="middle" font-size="19" fill="#78948a" stroke="#fffef9" stroke-width="8" paint-order="stroke">转置 → 拼接头</text><g class="node active" tabindex="0" role="button" aria-label="① 当前 token 输入" data-node="input"><rect class="box" x="500" y="45" width="360" height="105" rx="12" fill="#fffef9" stroke="#8ba296" stroke-width="1.8"/><text x="680" y="79" text-anchor="middle" font-size="23" fill="#17634f" font-weight="650">① 当前 token 输入</text><text x="680" y="110" text-anchor="middle" font-size="19" fill="#20332f" font-weight="400">X_new [1,1,4] · 位置 t=5</text></g><g class="node " tabindex="0" role="button" aria-label="MLA 缓存投影" data-node="kv"><rect class="box" x="40" y="245" width="360" height="125" rx="12" fill="#fffef9" stroke="#8ba296" stroke-width="1.8"/><text x="220" y="279" text-anchor="middle" font-size="23" fill="#17634f" font-weight="650">MLA 缓存投影</text><text x="220" y="310" text-anchor="middle" font-size="19" fill="#20332f" font-weight="400">C_new [1,1,2]</text><text x="220" y="337" text-anchor="middle" font-size="19" fill="#677770" font-weight="400">Kᴿ_new [1,1,2] · 已做 RoPE</text></g><g class="node " tabindex="0" role="button" aria-label="查询降维" data-node="cq"><rect class="box" x="500" y="245" width="360" height="125" rx="12" fill="#fffef9" stroke="#8ba296" stroke-width="1.8"/><text x="680" y="279" text-anchor="middle" font-size="23" fill="#17634f" font-weight="650">查询降维</text><text x="680" y="310" text-anchor="middle" font-size="19" fill="#20332f" font-weight="400">Cᴽ = X_new WᴰQ</text><text x="680" y="337" text-anchor="middle" font-size="19" fill="#677770" font-weight="400">[1,1,2]</text></g><g class="node " tabindex="0" role="button" aria-label="② Indexer 的独立投影" data-node="index"><rect class="box" x="960" y="245" width="380" height="150" rx="12" fill="#fff6e9" stroke="#bc8455" stroke-width="1.8"/><text x="1150" y="279" text-anchor="middle" font-size="23" fill="#9b4e25" font-weight="650">② Indexer 的独立投影</text><text x="1150" y="310" text-anchor="middle" font-size="19" fill="#20332f" font-weight="400">Qᴵ ← Cᴽ；Kᴵ、wᴵ ← X</text><text x="1150" y="337" text-anchor="middle" font-size="19" fill="#677770" font-weight="400">Qᴵ [1,2,1,2] · wᴵ [1,1,2]</text><text x="1150" y="364" text-anchor="middle" font-size="19" fill="#677770" font-weight="400">Kᴵ_cache [1,6,2]</text></g><g class="node " tabindex="0" role="button" aria-label="全部历史 MLA 缓存" data-node="cache"><rect class="box" x="40" y="470" width="360" height="140" rx="12" fill="#e7efe7" stroke="#8ba296" stroke-width="1.8"/><text x="220" y="504" text-anchor="middle" font-size="23" fill="#17634f" font-weight="650">全部历史 MLA 缓存</text><text x="220" y="535" text-anchor="middle" font-size="19" fill="#20332f" font-weight="400">C_cache [1,6,2]</text><text x="220" y="562" text-anchor="middle" font-size="19" fill="#677770" font-weight="400">Kᴿ_cache [1,6,2]</text><text x="220" y="589" text-anchor="middle" font-size="19" fill="#677770" font-weight="400">共有 6 行，不删除未选中的行</text></g><g class="node " tabindex="0" role="button" aria-label="主 MLA 的 Query" data-node="q"><rect class="box" x="500" y="470" width="360" height="140" rx="12" fill="#fffef9" stroke="#8ba296" stroke-width="1.8"/><text x="680" y="504" text-anchor="middle" font-size="23" fill="#17634f" font-weight="650">主 MLA 的 Query</text><text x="680" y="535" text-anchor="middle" font-size="19" fill="#20332f" font-weight="400">Qᶜ（NoPE）[1,2,1,2]</text><text x="680" y="562" text-anchor="middle" font-size="19" fill="#677770" font-weight="400">Qᴿ（RoPE）[1,2,1,2]</text><text x="680" y="589" text-anchor="middle" font-size="19" fill="#677770" font-weight="400">两个主头，分别计算</text></g><g class="node " tabindex="0" role="button" aria-label="③ 对 6 个位置轻量评分" data-node="rank"><rect class="box" x="960" y="500" width="380" height="140" rx="12" fill="#fff6e9" stroke="#bc8455" stroke-width="1.8"/><text x="1150" y="534" text-anchor="middle" font-size="23" fill="#9b4e25" font-weight="650">③ 对 6 个位置轻量评分</text><text x="1150" y="565" text-anchor="middle" font-size="19" fill="#20332f" font-weight="400">ReLU 点积 → 按 Indexer 头汇总</text><text x="1150" y="592" text-anchor="middle" font-size="19" fill="#677770" font-weight="400">I [1,1,6]</text><text x="1150" y="619" text-anchor="middle" font-size="19" fill="#677770" font-weight="400">[0.50, 1.75, 2, 0.75, 0.50, 1.25]</text></g><g class="node " tabindex="0" role="button" aria-label="④ Top-2 位置编号" data-node="top"><rect class="box" x="960" y="735" width="380" height="120" rx="12" fill="#fff6e9" stroke="#bc8455" stroke-width="1.8"/><text x="1150" y="769" text-anchor="middle" font-size="23" fill="#9b4e25" font-weight="650">④ Top-2 位置编号</text><text x="1150" y="800" text-anchor="middle" font-size="19" fill="#20332f" font-weight="400">ids [1,1,2] = [2, 1]</text><text x="1150" y="827" text-anchor="middle" font-size="19" fill="#677770" font-weight="400">它们是地址，不是注意力权重</text></g><g class="node " tabindex="0" role="button" aria-label="⑤ 按 ids 读取两份缓存" data-node="gather"><rect class="box" x="40" y="760" width="360" height="140" rx="12" fill="#e7efe7" stroke="#8ba296" stroke-width="1.8"/><text x="220" y="794" text-anchor="middle" font-size="23" fill="#17634f" font-weight="650">⑤ 按 ids 读取两份缓存</text><text x="220" y="825" text-anchor="middle" font-size="19" fill="#20332f" font-weight="400">C_sel [1,1,2,2]</text><text x="220" y="852" text-anchor="middle" font-size="19" fill="#677770" font-weight="400">Kᴿ_sel [1,1,2,2]</text><text x="220" y="879" text-anchor="middle" font-size="19" fill="#677770" font-weight="400">只读位置 [2, 1]</text></g><g class="node " tabindex="0" role="button" aria-label="展开选中的 K、V" data-node="expand"><rect class="box" x="40" y="1050" width="360" height="160" rx="12" fill="#fffef9" stroke="#8ba296" stroke-width="1.8"/><text x="220" y="1084" text-anchor="middle" font-size="23" fill="#17634f" font-weight="650">展开选中的 K、V</text><text x="220" y="1115" text-anchor="middle" font-size="19" fill="#20332f" font-weight="400">Kᶜ_h = C_sel Uᴷ_h</text><text x="220" y="1142" text-anchor="middle" font-size="19" fill="#677770" font-weight="400">V_h = C_sel Uⱽ_h；共享 Kᴿ</text><text x="220" y="1169" text-anchor="middle" font-size="19" fill="#677770" font-weight="400">各 [1,2,1,2,2]</text><text x="220" y="1196" text-anchor="middle" font-size="19" fill="#677770" font-weight="400">此处是便于对照原图的写法</text></g><g class="node " tabindex="0" role="button" aria-label="⑥ 主 MLA 重新打分" data-node="score"><rect class="box" x="500" y="1260" width="360" height="160" rx="12" fill="#fffef9" stroke="#8ba296" stroke-width="1.8"/><text x="680" y="1294" text-anchor="middle" font-size="23" fill="#17634f" font-weight="650">⑥ 主 MLA 重新打分</text><text x="680" y="1325" text-anchor="middle" font-size="19" fill="#20332f" font-weight="400">Qᶜ(Kᶜ)ᵀ + Qᴿ(Kᴿ)ᵀ</text><text x="680" y="1352" text-anchor="middle" font-size="19" fill="#677770" font-weight="400">再除以 √(dₙ+dᵣ) = 2</text><text x="680" y="1379" text-anchor="middle" font-size="19" fill="#677770" font-weight="400">S [1,2,1,2]</text><text x="680" y="1406" text-anchor="middle" font-size="19" fill="#677770" font-weight="400">每个头只算 2 个位置</text></g><g class="node " tabindex="0" role="button" aria-label="⑦ softmax → 真正权重" data-node="softmax"><rect class="box" x="500" y="1500" width="360" height="110" rx="12" fill="#fffef9" stroke="#8ba296" stroke-width="1.8"/><text x="680" y="1534" text-anchor="middle" font-size="23" fill="#17634f" font-weight="650">⑦ softmax → 真正权重</text><text x="680" y="1565" text-anchor="middle" font-size="19" fill="#20332f" font-weight="400">A [1,2,1,2] · 每行和为 1</text></g><g class="node " tabindex="0" role="button" aria-label="⑧ 对选中的 V 加权求和" data-node="sum"><rect class="box" x="500" y="1710" width="360" height="110" rx="12" fill="#fffef9" stroke="#8ba296" stroke-width="1.8"/><text x="680" y="1744" text-anchor="middle" font-size="23" fill="#17634f" font-weight="650">⑧ 对选中的 V 加权求和</text><text x="680" y="1775" text-anchor="middle" font-size="19" fill="#20332f" font-weight="400">Z = A V → [1,2,1,2]</text></g><g class="node " tabindex="0" role="button" aria-label="⑨ 合并头 + 输出投影" data-node="out"><rect class="box" x="500" y="1905" width="360" height="110" rx="12" fill="#fffef9" stroke="#8ba296" stroke-width="1.8"/><text x="680" y="1939" text-anchor="middle" font-size="23" fill="#17634f" font-weight="650">⑨ 合并头 + 输出投影</text><text x="680" y="1970" text-anchor="middle" font-size="19" fill="#20332f" font-weight="400">concat → Wᴼ → Y [1,1,4]</text></g></svg>