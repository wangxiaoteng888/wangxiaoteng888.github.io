<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 2110" role="group" aria-label="MLA 展开路径张量数据流" style="font-family:Segoe UI,Microsoft YaHei,sans-serif"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#78948a"/></marker></defs><rect width="1400" height="2110" fill="#fffef9"/><text x="220" y="28" text-anchor="middle" font-size="18" fill="#677770" font-weight="400">当前查询路径</text><text x="1140" y="28" text-anchor="middle" font-size="18" fill="#17634f" font-weight="400">绿色粗边框 = 需要存入 KV Cache</text><text x="1140" y="1430" text-anchor="middle" font-size="25" fill="#ad582b" font-weight="650">直观写法</text><text x="1140" y="1475" text-anchor="middle" font-size="22" fill="#677770" font-weight="400">C → 每个头的 Kᶜ、V</text><text x="1140" y="1520" text-anchor="middle" font-size="21" fill="#677770" font-weight="400">下一张图会省掉显式展开</text><path d="M680 145 V200 H220 V250" fill="none" stroke="#78948a" stroke-width="2" marker-end="url(#arr)"/><text x="300" y="190" text-anchor="middle" font-size="18" fill="#677770" stroke="#fffef9" stroke-width="8" paint-order="stroke">X</text><path d="M680 145 V250" fill="none" stroke="#78948a" stroke-width="2" marker-end="url(#arr)"/><path d="M680 145 V200 H1150 V250" fill="none" stroke="#78948a" stroke-width="2" marker-end="url(#arr)"/><text x="1050" y="190" text-anchor="middle" font-size="18" fill="#677770" stroke="#fffef9" stroke-width="8" paint-order="stroke">X</text><path d="M220 380 V520" fill="none" stroke="#78948a" stroke-width="2" marker-end="url(#arr)"/><text x="220" y="460" text-anchor="middle" font-size="18" fill="#677770" stroke="#fffef9" stroke-width="8" paint-order="stroke">WᵁQ / Wᴽᴿ</text><path d="M680 405 V520" fill="none" stroke="#78948a" stroke-width="2" marker-end="url(#arr)"/><text x="680" y="470" text-anchor="middle" font-size="18" fill="#677770" stroke="#fffef9" stroke-width="8" paint-order="stroke">C [1,5,3]</text><path d="M680 670 V790" fill="none" stroke="#78948a" stroke-width="2" marker-end="url(#arr)"/><path d="M220 695 V1190 H250" fill="none" stroke="#78948a" stroke-width="2" marker-end="url(#arr)"/><text x="120" y="1030" text-anchor="middle" font-size="18" fill="#677770" stroke="#fffef9" stroke-width="8" paint-order="stroke">Qᶜ、Qᴿ</text><path d="M680 940 V1110" fill="none" stroke="#78948a" stroke-width="2" marker-end="url(#arr)"/><text x="720" y="1050" text-anchor="middle" font-size="18" fill="#677770" stroke="#fffef9" stroke-width="8" paint-order="stroke">Kᶜ</text><path d="M1150 405 V1190 H880" fill="none" stroke="#78948a" stroke-width="2" marker-end="url(#arr)"/><text x="1150" y="1070" text-anchor="middle" font-size="18" fill="#677770" stroke="#fffef9" stroke-width="8" paint-order="stroke">共享 Kᴿ</text><path d="M565 1285 V1390" fill="none" stroke="#78948a" stroke-width="2" marker-end="url(#arr)"/><text x="565" y="1350" text-anchor="middle" font-size="18" fill="#677770" stroke="#fffef9" stroke-width="8" paint-order="stroke">缩放后的分数 + mask</text><path d="M565 1505 V1630" fill="none" stroke="#78948a" stroke-width="2" marker-end="url(#arr)"/><text x="605" y="1580" text-anchor="middle" font-size="18" fill="#677770" stroke="#fffef9" stroke-width="8" paint-order="stroke">A</text><path d="M880 865 H930 V1690 H880" fill="none" stroke="#78948a" stroke-width="2" marker-end="url(#arr)"/><text x="970" y="1565" text-anchor="middle" font-size="18" fill="#677770" stroke="#fffef9" stroke-width="8" paint-order="stroke">V</text><path d="M565 1755 V1900" fill="none" stroke="#78948a" stroke-width="2" marker-end="url(#arr)"/><text x="565" y="1840" text-anchor="middle" font-size="18" fill="#677770" stroke="#fffef9" stroke-width="8" paint-order="stroke">两个头的输出</text><g class="node " tabindex="0" role="button" data-node="input" aria-label="X：五个 token 的输入"><rect class="box" x="480" y="40" width="400" height="105" rx="12" fill="#fffef9" stroke="#8ba296" stroke-width="1.8"/><text x="680" y="76" text-anchor="middle" font-size="22" fill="#17634f" font-weight="650">X：五个 token 的输入</text><text x="680" y="110" text-anchor="middle" font-size="19" fill="#20332f" font-weight="400">[1,5,4] · 同一注意力层</text></g><g class="node " tabindex="0" role="button" data-node="cq" aria-label="Query 下投影"><rect class="box" x="30" y="250" width="380" height="130" rx="12" fill="#fffef9" stroke="#8ba296" stroke-width="1.8"/><text x="220" y="286" text-anchor="middle" font-size="22" fill="#17634f" font-weight="650">Query 下投影</text><text x="220" y="320" text-anchor="middle" font-size="19" fill="#20332f" font-weight="400">Cᴽ = X WᴰQ</text><text x="220" y="348" text-anchor="middle" font-size="19" fill="#677770" font-weight="400">[1,5,4] × [4,2] → [1,5,2]</text></g><g class="node active" tabindex="0" role="button" data-node="c" aria-label="缓存① 共享压缩内容 Cᴷⱽ"><rect class="box" x="480" y="250" width="400" height="155" rx="12" fill="#e3eee4" stroke="#17634f" stroke-width="3"/><text x="680" y="286" text-anchor="middle" font-size="22" fill="#17634f" font-weight="650">缓存① 共享压缩内容 Cᴷⱽ</text><text x="680" y="320" text-anchor="middle" font-size="19" fill="#20332f" font-weight="400">C = X Wᴰᴷⱽ</text><text x="680" y="348" text-anchor="middle" font-size="19" fill="#677770" font-weight="400">[1,5,4] × [4,3] → [1,5,3]</text><text x="680" y="376" text-anchor="middle" font-size="19" fill="#677770" font-weight="400">每个 token 存 3 个数</text></g><g class="node " tabindex="0" role="button" data-node="kr" aria-label="缓存② 已旋转的位置 Key"><rect class="box" x="950" y="250" width="400" height="155" rx="12" fill="#e3eee4" stroke="#17634f" stroke-width="3"/><text x="1150" y="286" text-anchor="middle" font-size="22" fill="#17634f" font-weight="650">缓存② 已旋转的位置 Key</text><text x="1150" y="320" text-anchor="middle" font-size="19" fill="#20332f" font-weight="400">Kᴿ = RoPE(X Wᴷᴿ)</text><text x="1150" y="348" text-anchor="middle" font-size="19" fill="#677770" font-weight="400">[1,5,4] × [4,2] → [1,5,2]</text><text x="1150" y="376" text-anchor="middle" font-size="19" fill="#677770" font-weight="400">各主头共享；每 token 再存 2 个数</text></g><g class="node " tabindex="0" role="button" data-node="q" aria-label="各头的 Qᶜ 与 Qᴿ"><rect class="box" x="30" y="520" width="380" height="175" rx="12" fill="#fffef9" stroke="#8ba296" stroke-width="1.8"/><text x="220" y="556" text-anchor="middle" font-size="22" fill="#17634f" font-weight="650">各头的 Qᶜ 与 Qᴿ</text><text x="220" y="590" text-anchor="middle" font-size="19" fill="#20332f" font-weight="400">Cᴽ 投影 → 两组 [1,5,4]</text><text x="220" y="618" text-anchor="middle" font-size="19" fill="#677770" font-weight="400">reshape → [1,5,2,2]</text><text x="220" y="646" text-anchor="middle" font-size="19" fill="#677770" font-weight="400">transpose → [1,2,5,2]</text><text x="220" y="674" text-anchor="middle" font-size="19" fill="#677770" font-weight="400">Qᴿ 额外按位置做 RoPE</text></g><g class="node " tabindex="0" role="button" data-node="expand" aria-label="C 上投影为内容 K、V"><rect class="box" x="480" y="520" width="400" height="150" rx="12" fill="#fffef9" stroke="#8ba296" stroke-width="1.8"/><text x="680" y="556" text-anchor="middle" font-size="22" fill="#17634f" font-weight="650">C 上投影为内容 K、V</text><text x="680" y="590" text-anchor="middle" font-size="19" fill="#20332f" font-weight="400">Kᶜ_flat = C Uᴷ；V_flat = C Uⱽ</text><text x="680" y="618" text-anchor="middle" font-size="19" fill="#677770" font-weight="400">[1,5,3] × [3,4] → 两个 [1,5,4]</text><text x="680" y="646" text-anchor="middle" font-size="19" fill="#677770" font-weight="400">两套权重，各自生成所有头</text></g><g class="node " tabindex="0" role="button" data-node="split" aria-label="拆出两个头"><rect class="box" x="480" y="790" width="400" height="150" rx="12" fill="#fffef9" stroke="#8ba296" stroke-width="1.8"/><text x="680" y="826" text-anchor="middle" font-size="22" fill="#17634f" font-weight="650">拆出两个头</text><text x="680" y="860" text-anchor="middle" font-size="19" fill="#20332f" font-weight="400">reshape [1,5,2,2]</text><text x="680" y="888" text-anchor="middle" font-size="19" fill="#677770" font-weight="400">transpose → Kᶜ、V [1,2,5,2]</text><text x="680" y="916" text-anchor="middle" font-size="19" fill="#677770" font-weight="400">数值不变，只改变索引</text></g><g class="node " tabindex="0" role="button" data-node="score" aria-label="主注意力分数：对应头的 Q 与 K"><rect class="box" x="250" y="1110" width="630" height="175" rx="12" fill="#fffef9" stroke="#8ba296" stroke-width="1.8"/><text x="565" y="1146" text-anchor="middle" font-size="22" fill="#17634f" font-weight="650">主注意力分数：对应头的 Q 与 K</text><text x="565" y="1180" text-anchor="middle" font-size="19" fill="#20332f" font-weight="400">S = [Qᶜ(Kᶜ)ᵀ + Qᴿ(Kᴿ)ᵀ] / 2</text><text x="565" y="1208" text-anchor="middle" font-size="19" fill="#677770" font-weight="400">内容点积 + 位置点积，再加因果 mask</text><text x="565" y="1236" text-anchor="middle" font-size="19" fill="#677770" font-weight="400">[1,2,5,2] × [1,2,2,5] → [1,2,5,5]</text><text x="565" y="1264" text-anchor="middle" font-size="19" fill="#677770" font-weight="400">等价：拼接 Q/K 为 [1,2,5,4] 后做点积</text></g><g class="node " tabindex="0" role="button" data-node="a" aria-label="softmax：每头、每行沿历史位置归一化"><rect class="box" x="250" y="1390" width="630" height="115" rx="12" fill="#fffef9" stroke="#8ba296" stroke-width="1.8"/><text x="565" y="1426" text-anchor="middle" font-size="22" fill="#17634f" font-weight="650">softmax：每头、每行沿历史位置归一化</text><text x="565" y="1460" text-anchor="middle" font-size="19" fill="#20332f" font-weight="400">A [1,2,5,5] · 未来位置为 0</text></g><g class="node " tabindex="0" role="button" data-node="mix" aria-label="加权 Value：Z_h = A_h V_h"><rect class="box" x="250" y="1630" width="630" height="125" rx="12" fill="#fffef9" stroke="#8ba296" stroke-width="1.8"/><text x="565" y="1666" text-anchor="middle" font-size="22" fill="#17634f" font-weight="650">加权 Value：Z_h = A_h V_h</text><text x="565" y="1700" text-anchor="middle" font-size="19" fill="#20332f" font-weight="400">[1,2,5,5] × [1,2,5,2] → [1,2,5,2]</text><text x="565" y="1728" text-anchor="middle" font-size="19" fill="#677770" font-weight="400">求和消掉历史位置轴，保留 query 轴</text></g><g class="node " tabindex="0" role="button" data-node="out" aria-label="转置、拼接各头，再乘 Wᴼ"><rect class="box" x="250" y="1900" width="630" height="135" rx="12" fill="#fffef9" stroke="#8ba296" stroke-width="1.8"/><text x="565" y="1936" text-anchor="middle" font-size="22" fill="#17634f" font-weight="650">转置、拼接各头，再乘 Wᴼ</text><text x="565" y="1970" text-anchor="middle" font-size="19" fill="#20332f" font-weight="400">[1,2,5,2] → [1,5,2,2] → [1,5,4]</text><text x="565" y="1998" text-anchor="middle" font-size="19" fill="#677770" font-weight="400">× Wᴼ [4,4] → Y [1,5,4]</text></g></svg>